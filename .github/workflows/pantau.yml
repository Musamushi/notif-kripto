name: Pantau Kripto

on:
  schedule:
    - cron: "*/15 * * * *"   # tiap 15 menit (jam UTC); GitHub sering telat beberapa menit
  workflow_dispatch:
    inputs:
      mode:
        description: "normal, atau tes = kirim ringkasan semua koin ke Telegram"
        type: choice
        options: [normal, tes]
        default: normal

permissions:
  contents: write

concurrency:
  group: pantau-kripto

jobs:
  pantau:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Periksa harga
        run: python3 pantau.py ${{ inputs.mode == 'tes' && '--tes' || '' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Simpan data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Perbarui data harga"
            git pull --rebase
            git push
          fi
